<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Feedback Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>User Feedback Form</h1>

    <form id="feedbackForm">
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter your name" required>
        <span class="tooltip">Enter your full name</span>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter your email" required>
        <span class="tooltip">Enter a valid email</span>

        <label for="feedback">Feedback:</label>
        <textarea id="feedback" name="feedback" placeholder="Enter your feedback" required></textarea>
        <span class="tooltip">Enter your feedback</span>

        <div id="char-count">0 / 200 characters</div>

        <button type="submit">Submit</button>
    </form>

    <h2>Feedback Submitted</h2>
    <div id="submittedFeedback"></div>

    <script src="cp_1.js"></script>
</body>
</html>
